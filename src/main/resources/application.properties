# Banco de dados
spring.application.name=routeexpress
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SQL_URL_1}
spring.datasource.username=${SQL_USERNAME_1}
spring.datasource.password=${SQL_SENHA_1}


# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-part-count=30
server.servlet.session.timeout=10m

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}




# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=604800000

# Frontend URL
app.frontend.url=${FRONTEND_URL}

# CORS
app.cors.origins=${CORS_ORIGINS:http://localhost:4200,http://192.168.1.131:4200,https://beer-ecommerce-frontend.vercel.app}