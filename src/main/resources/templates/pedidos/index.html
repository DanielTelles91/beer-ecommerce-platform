<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route Express - Pedidos</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
	rel="stylesheet">
</head>
<body class="bg-dark text-light">

	<!-- NAVBAR -->
	<nav
		class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary">
		<div class="container-fluid px-4">

			<a class="navbar-brand fw-bold" href="/adm/telaInicialAdm"> Route
				Express <span class="text-success">Back Office</span>
			</a>

			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#nav">
				<span class="navbar-toggler-icon"></span>
			</button>

			<div class="collapse navbar-collapse" id="nav">

				<ul class="navbar-nav me-auto gap-2">
					<li><a class="nav-link" href="/clientes">Clientes</a></li>
					<li><a class="nav-link" href="/cervejarias">Cervejarias</a></li>
					<li><a class="nav-link" href="/cervejas">Cervejas</a></li>
					<li><a class="nav-link" href="/estoque">Estoque</a></li>
					<li><a class="nav-link active" href="/pedidos">Pedidos</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<div class="container py-4">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<div>
				<h1 class="mb-0">Pedidos</h1>
				<small class="text-secondary"> Gerenciamento de pedidos </small>
			</div>
			<div>
				<a class="btn btn-outline-light me-2" href="/adm"> ← Voltar </a> 
			</div>
		</div>

		<!-- Filtro por status -->
		<form method="get" action="/pedidos" class="d-flex gap-2 mb-4">
			<select name="status" class="form-select w-auto">
				<option value="">Todos os status</option>
				<option th:each="s : ${statusOpcoes}" th:value="${s}" th:text="${s}"
					th:selected="${s == statusFiltro}"></option>
			</select>
			<button class="btn btn-outline-light" type="submit">Filtrar</button>
			<a href="/adm/pedidos" class="btn btn-outline-secondary">Limpar</a>
		</form>

		<!-- Tabela de pedidos -->
		<table class="table table-dark table-striped table-hover">
			<thead class="table-warning">
				<tr>
					<th>Nº do Pedido</th>
					<th>Cliente</th>
					<th>Data</th>
					<th>Status</th>
					<th>Total</th>
					<th>Ações</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="p : ${pedidos}">
					<td th:text="${p.id}"></td>
					<td th:text="${p.nomeCliente}"></td>
					<td
						th:text="${#temporals.format(p.dataPedido, 'dd/MM/yyyy HH:mm')}"></td>
					<td><span class="badge"
						th:classappend="${p.status == 'ENTREGUE'} ? 'bg-success' :
                                  (${p.status == 'CANCELADO'} ? 'bg-danger' :
                                  (${p.status == 'ENVIADO'} ? 'bg-primary' : 'bg-warning text-dark'))"
						th:text="${p.status}"> </span></td>
					<td
						th:text="${'R$ ' + #numbers.formatDecimal(p.total, 1, 'POINT', 2, 'COMMA')}"></td>
					<td><a th:href="@{/pedidos/{id}(id=${p.id})}"
						class="btn btn-sm btn-outline-light">Ver</a></td>
				</tr>
				<tr th:if="${#lists.isEmpty(pedidos)}">
					<td colspan="6" class="text-center text-muted">Nenhum pedido
						encontrado.</td>
				</tr>
			</tbody>
		</table>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
