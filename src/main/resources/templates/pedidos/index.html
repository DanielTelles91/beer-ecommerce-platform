<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route Express - Pedidos</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
	rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/telaInicialAdm.css}">
</head>
<body class="bg-dark text-light">

	<nav
		class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary">
		<div class="container-fluid px-4">
			<a class="navbar-brand fw-bold" href="/adm/telaInicialAdm">Route
				Express <span class="text-success">Back Office</span>
			</a>
			<div class="collapse navbar-collapse">
				<ul class="navbar-nav me-auto gap-2">
					<li><a class="nav-link" href="/clientes">Clientes</a></li>
					<li><a class="nav-link" href="/cervejarias">Cervejarias</a></li>
					<li><a class="nav-link" href="/cervejas">Cervejas</a></li>
					<li><a class="nav-link" href="/estoque">Estoque</a></li>
					<li><a class="nav-link active" href="/pedidos">Pedidos</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<div class="container-fluid px-4 py-4">

		<h4 class="fw-bold mb-4">Pedidos</h4>

		<!-- CONTADORES POR STATUS -->
		<div class="row g-2 mb-4">
			<div class="col-6 col-md">
				<a href="/pedidos?status=CONFIRMADO" class="text-decoration-none">
					<div class="card glass p-3 text-center border-warning">
						<div class="text-warning fw-bold fs-4"
							th:text="${contadores['CONFIRMADO']}">0</div>
						<small class="text-muted">Confirmados</small>
					</div>
				</a>
			</div>
			<div class="col-6 col-md">
				<a href="/pedidos?status=SEPARANDO_PRODUTOS"
					class="text-decoration-none">
					<div class="card glass p-3 text-center border-info">
						<div class="text-info fw-bold fs-4"
							th:text="${contadores['SEPARANDO_PRODUTOS']}">0</div>
						<small class="text-muted">Separando</small>
					</div>
				</a>
			</div>
			<div class="col-6 col-md">
				<a href="/pedidos?status=ENVIADO" class="text-decoration-none">
					<div class="card glass p-3 text-center border-primary">
						<div class="text-primary fw-bold fs-4"
							th:text="${contadores['ENVIADO']}">0</div>
						<small class="text-muted">Enviados</small>
					</div>
				</a>
			</div>
			<div class="col-6 col-md">
				<a href="/pedidos?status=ENTREGUE" class="text-decoration-none">
					<div class="card glass p-3 text-center border-success">
						<div class="text-success fw-bold fs-4"
							th:text="${contadores['ENTREGUE']}">0</div>
						<small class="text-muted">Entregues</small>
					</div>
				</a>
			</div>
			<div class="col-6 col-md">
				<a href="/pedidos?status=CANCELADO" class="text-decoration-none">
					<div class="card glass p-3 text-center border-danger">
						<div class="text-danger fw-bold fs-4"
							th:text="${contadores['CANCELADO']}">0</div>
						<small class="text-muted">Cancelados</small>
					</div>
				</a>
			</div>
			<div class="col-6 col-md">
				<a href="/pedidos" class="text-decoration-none">
					<div class="card glass p-3 text-center">
						<div class="text-light fw-bold fs-4"
							th:text="${contadores['CONFIRMADO'] + contadores['SEPARANDO_PRODUTOS'] +
                            contadores['ENVIADO'] + contadores['ENTREGUE'] + contadores['CANCELADO']}">0</div>
						<small class="text-muted">Total</small>
					</div>
				</a>
			</div>
		</div>

		<!-- FILTROS -->
		<form method="get" action="/pedidos" class="card glass p-3 mb-4">
			<div class="row g-2 align-items-end">

				<div class="col-md-3">
					<label class="form-label small text-muted">Buscar cliente
						ou #pedido</label> <input type="text" name="busca"
						class="form-control bg-dark text-light border-secondary"
						placeholder="Nome ou número..." th:value="${busca}" />
				</div>

				<div class="col-md-2">
					<label class="form-label small text-muted">Status</label> <select
						name="status"
						class="form-select bg-dark text-light border-secondary">
						<option value="">Todos</option>
						<option th:each="s : ${statusOpcoes}" th:value="${s}"
							th:text="${s}" th:selected="${s == statusFiltro}"></option>
					</select>
				</div>

				<div class="col-md-2">
					<label class="form-label small text-muted">De</label> <input
						type="date" name="dataInicio"
						class="form-control bg-dark text-light border-secondary"
						th:value="${dataInicio}" />
				</div>

				<div class="col-md-2">
					<label class="form-label small text-muted">Até</label> <input
						type="date" name="dataFim"
						class="form-control bg-dark text-light border-secondary"
						th:value="${dataFim}" />
				</div>

				<div class="col-md-3 d-flex gap-2">
					<button type="submit" class="btn btn-success flex-fill">
						<i class="bi bi-search me-1"></i> Filtrar
					</button>
					<a href="/pedidos" class="btn btn-outline-secondary"> <i
						class="bi bi-x-lg"></i>
					</a>
				</div>

			</div>
		</form>

		<!-- TABELA -->
		<div class="card glass">
			<div class="table-responsive">
				<table class="table table-dark table-hover mb-0">
					<thead class="table-warning">
						<tr>
							<th># Pedido</th>
							<th>Cliente</th>
							<th>Data</th>
							<th>Status</th>
							<th>Total</th>
							<th>Ações</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="p : ${pedidos}">
							<td class="text-muted" th:text="${'#' + p.id}"></td>
							<td th:text="${p.nomeCliente}"></td>
							<td class="text-muted small"
								th:text="${#temporals.format(p.dataPedido, 'dd/MM/yyyy HH:mm')}"></td>
							<td><span class="badge"
								th:classappend="${p.status == 'ENTREGUE'} ? 'bg-success' :
                                      (${p.status == 'CANCELADO'} ? 'bg-danger' :
                                      (${p.status == 'ENVIADO'} ? 'bg-primary' :
                                      (${p.status == 'SEPARANDO_PRODUTOS'} ? 'bg-info text-dark' :
                                       'bg-warning text-dark')))"
								th:text="${p.status}"> </span></td>
							<td
								th:text="${'R$ ' + #numbers.formatDecimal(p.total, 1, 'POINT', 2, 'COMMA')}"></td>
							<td><a th:href="@{/pedidos/{id}(id=${p.id})}"
								class="btn btn-sm btn-outline-light"> <i
									class="bi bi-eye me-1"></i>Ver
							</a></td>
						</tr>
						<tr th:if="${#lists.isEmpty(pedidos)}">
							<td colspan="6" class="text-center text-muted py-4">Nenhum
								pedido encontrado.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
