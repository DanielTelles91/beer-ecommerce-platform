<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route Express - Cervejarias</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
	crossorigin="anonymous">

<link rel="stylesheet" th:href="@{/css/cervejaria.css}">
</head>
<body class="bg-dark text-light">
	<!-- Navbar  -->
	<nav
		class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary">
		<div class="container-fluid">
			<a class="navbar-brand fw-bold" href="/adm/telaInicialAdm">Route
				Express Back Office</a>
			<div class="collapse navbar-collapse">
				<ul class="navbar-nav me-auto">
					<li class="nav-item"><a class="nav-link" href="/clientes">Clientes</a></li>
					<li class="nav-item"><a class="nav-link active"
						href="/cervejarias">Cervejarias</a></li>
					<li class="nav-item"><a class="nav-link" href="/cervejas">Cervejas</a></li>
					<li class="nav-item"><a class="nav-link" href="/estoque">Estoque</a></li>
					<li class="nav-item"><a class="nav-link" href="/pedidos">Pedidos</a></li>
				</ul>
			</div>
		</div>
	</nav>
	<div class="container py-4">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<div>
				<h1 class="mb-0">Cervejarias</h1>
				<small class="text-secondary"> Gerenciamento de cervejarias
					cadastradas </small>
			</div>
			<div>
				<a class="btn btn-outline-light me-2" href="/adm"> ← Voltar </a> <a
					class="btn btn-success" href="/cervejarias/create"> + Nova
					Cervejaria </a>
			</div>
		</div>
		<div class="p-3 bg-dark border-bottom">
			<div class="row">
				<div class="col-md-6">
					<input type="text" id="filtro" class="form-control"
						placeholder="Pesquisar cervejaria ou país...">
				</div>
				<div class="col-md-3">
					<select id="ordenacao" class="form-select">
						<option value="">Ordenar</option>
						<option value="az">A → Z</option>
						<option value="za">Z → A</option>
					</select>
				</div>
			</div>
		</div>
		<div class="card bg-secondary border-0 shadow">
			<div
				class="card-header bg-dark d-flex justify-content-between align-items-center">
				<h5 class="mb-0 subTitulo">Lista de Cervejarias</h5>
				<span class="badge bg-primary fs-6"
					th:text="${#lists.size(cervejarias)} + ' registros'"> 0
					registros </span>
			</div>
			<div class="card-body p-0">
				<div class="table-responsive">
					<div class="table-responsive tabela-scroll">
						<table id="tabelaCervejarias"
							class="table table-dark table-hover table-striped mb-0 align-middle">
							<thead class="table-warning">
								<tr>
									<th>Cervejaria</th>
									<th>País</th>
									<th width="160">Ações</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="cervejaria : ${cervejarias}">
									<td><strong th:text="${cervejaria.cervejaria}"> </strong>
									</td>
									<td><span class="badge bg-info text-dark"
										th:text="${cervejaria.pais}"> </span></td>
									<td>
										<div class="btn-group">
											<a class="btn btn-warning btn-sm"
												th:href="@{/cervejarias/edit(id=${cervejaria.id})}">
												Edit </a> <a class="btn btn-danger btn-sm"
												th:data-nome="${cervejaria.cervejaria}"
												th:href="@{/cervejarias/delete(id=${cervejaria.id})}"
												onclick="return confirmarExclusao(this)"> Delete </a>
										</div>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
	<script src="/js/cervejarias.js"></script>
</body>
</html>
