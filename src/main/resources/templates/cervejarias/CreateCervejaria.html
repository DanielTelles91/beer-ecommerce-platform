<!doctype html>
<html lang="en">
   <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Route Express - Nova Cervejaria</title>
      <link
         href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
         rel="stylesheet"
         integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
         crossorigin="anonymous">
   </head>
   <body class="bg-dark text-light">
      <div class="container py-4">
      <div class="row">
         <div class="col-lg-10 mx-auto">
            <div class="border rounded p-4">
               <div class="d-flex justify-content-between align-items-center mb-4">
                  <h2 class="mb-0"> Nova Cervejaria</h2>
                  <a href="/cervejarias" class="btn btn-outline-light"> ← Voltar </a>
               </div>
               <div th:if="${erro}"
                  class="alert alert-danger alert-dismissible fade show" role="alert">
                  <span th:text="${erro}"></span>
                  <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
               </div>
               <div th:if="${sucesso}"
                  class="alert alert-success alert-dismissible fade show"
                  role="alert">
                  <span th:text="${sucesso}"></span>
                  <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
               </div>
               <form method="post" enctype="multipart/form-data"
                  th:object="${cervejariaDto}">
                  <div class="mb-3">
                     <label class="col-sm-4 col-form-label">Cervejaria</label>
                     <div class="col-sm-8">
                        <input class="form-control"
                           th:field="${cervejariaDto.cervejaria}">
                        <p th:if="${#fields.hasErrors('cervejaria')}"
                           th:errorclass="text-danger"
                           th:errors="${cervejariaDto.cervejaria}"></p>
                     </div>
                  </div>
                  <div class="mb-3">
                     <label class="col-sm-4 col-form-label">Pais</label>
                     <div class="col-sm-8">
                        <input class="form-control" th:field="${cervejariaDto.pais}">
                        <p th:if="${#fields.hasErrors('pais')}"
                           th:errorclass="text-danger" th:errors="${cervejariaDto.pais}"></p>
                     </div>
                  </div>
                  <div class="row mt-5">
                     <div class="col-md-6 d-grid">
                        <button type="submit" class="btn btn-success">Salvar Cervejaria</button>
                     </div>
                     <div class="col-md-6 d-grid">
                        <a class="btn btn-secondary" href="/cervejarias"
                           role="button">Cancelar</a>
                     </div>
                  </div>
               </form>
            </div>
         </div>
      </div>
      <script
         src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
         integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
         crossorigin="anonymous"></script>
   </body>
</html>
