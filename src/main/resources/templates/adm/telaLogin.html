<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route Express - Login</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
	crossorigin="anonymous">
</head>
<body class="bg-dark text-light">
	<div class="container">
		<div class="row vh-100 justify-content-center align-items-center">
			<div class="col-md-5 col-lg-4">
				<div class="card bg-secondary border-0 shadow-lg">
					<div class="card-body p-4">
						<div class="text-center mb-4">
							<h1 class="fw-bold">Route Express</h1>
							<p class="text-light mb-0">Back Office Login</p>
						</div>
						<div th:if="${param.error}" class="alert alert-danger">
							Usuário ou senha inválidos.</div>
						<div th:if="${param.logout}" class="alert alert-success">
							Logout realizado com sucesso.</div>
						<form th:action="@{/adm}" method="post">
							<div class="mb-3">
								<label class="form-label"> E-mail </label> <input type="text"
									name="username" class="form-control"
									placeholder="Digite seu e-mail" required>
							</div>
							<div class="mb-4">
								<label class="form-label"> Senha </label> <input type="password"
									name="password" class="form-control"
									placeholder="Digite sua senha" required>
							</div>
							<div class="d-grid">
								<button type="submit" class="btn btn-primary btn-lg">
									Entrar</button>
							</div>
						</form>
					</div>
				</div>
				<div class="text-center mt-3 text-secondary">Route Express ©
					2026</div>
			</div>
		</div>
	</div>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
</body>
</html>
