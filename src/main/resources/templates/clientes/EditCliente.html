<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route Express - Editar Cliente</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
	crossorigin="anonymous">
</head>
<body class="bg-dark text-light">
	<div class="container py-4">
		<div class="row">
			<div class="col-lg-10 mx-auto">
				<div class="border rounded p-4">
					<div class="d-flex justify-content-between align-items-center mb-4">
						<h2 class="text-center mb-4">Editar Cliente</h2>
						<a href="/clientes" class="btn btn-outline-light"> ← Voltar </a>
					</div>
					<div th:if="${erro}"
						class="alert alert-danger alert-dismissible fade show"
						role="alert">
						<span th:text="${erro}"></span>
						<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
					</div>
					<div th:if="${sucesso}"
						class="alert alert-success alert-dismissible fade show"
						role="alert">
						<span th:text="${sucesso}"></span>
						<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
					</div>
					<form method="post" enctype="multipart/form-data"
						th:object="${clienteDto}">
						<div class="mb-3">
							<label class="col-sm-4 col-form-label">Nome</label> <input
								class="form-control" maxlength="14"
								th:field="${clienteDto.first_name}">
							<p th:if="${#fields.hasErrors('first_name')}"
								th:errorclass="text-danger" th:errors="${clienteDto.first_name}"></p>
						</div>
						<div class="mb-3">
							<label class="col-sm-4 col-form-label">Sobrenome</label> <input
								class="form-control" maxlength="54"
								th:field="${clienteDto.last_name}">
							<p th:if="${#fields.hasErrors('last_name')}"
								th:errorclass="text-danger" th:errors="${clienteDto.last_name}"></p>
						</div>
						<div class="mb-3">
							<label class="col-sm-4 col-form-label">E-mail</label> <input
								class="form-control" maxlength="50"
								th:field="${clienteDto.email}">
							<p th:if="${#fields.hasErrors('email')}"
								th:errorclass="text-danger" th:errors="${clienteDto.email}"></p>
						</div>
						<div class="mb-3">
							<label class="col-sm-4 col-form-label">Número do Telefone</label>
							<input class="form-control" th:field="${clienteDto.telefone}"
								maxlength="14" oninput="mascaraTelefone(this)">
							<p th:if="${#fields.hasErrors('telefone')}"
								th:errorclass="text-danger" th:errors="${clienteDto.telefone}"></p>
						</div>
						<div class="mb-3">
							<label class="col-sm-4 col-form-label">CPF</label> <input
								class="form-control" th:field="${clienteDto.cpf}" maxlength="14"
								oninput="mascaraCPF(this)">
							<p th:if="${#fields.hasErrors('cpf')}"
								th:errorclass="text-danger" th:errors="${clienteDto.cpf}"></p>
						</div>
						<div class="mb-3">
							<label class="col-sm-4 col-form-label">Gênero</label> <select
								class="form-select" th:field="${clienteDto.sexo}" required>
								<option value="">Selecione...</option>
								<option value="Masculino">Masculino</option>
								<option value="Feminino">Feminino</option>
							</select>
							<p th:if="${#fields.hasErrors('sexo')}" class="text-danger"
								th:errors="${clienteDto.sexo}"></p>
						</div>
						<div class="mb-3">
							<label class="col-sm-4 col-form-label">Data de Nascimento</label>
							<input type="date" class="form-control"
								th:field="${clienteDto.data_nascimento}">
							<p th:if="${#fields.hasErrors('data_nascimento')}"
								th:errorclass="text-danger"
								th:errors="${clienteDto.data_nascimento}"></p>
						</div>

						<div class="row mt-5">
							<div class="col-md-12 d-grid">
								<button type="submit" class="btn btn-success">Salvar
									Alterações</button>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
	<script src="/js/cliente.js"></script>
</body>
</html>
