<!doctype html>
<html lang="en">
   <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Route Express - Cervejas</title>
      <link
         href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
         rel="stylesheet"
         integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
         crossorigin="anonymous">
      <style>
         .preview-img {
         width: 80px;
         height: 80px;
         object-fit: contain;
         background: white;
         border-radius: 8px;
         padding: 5px;
         border: 1px solid #dee2e6;
         }
         .table td, .table th {
         vertical-align: middle;
         }
      </style>
   </head>
   <body class="bg-dark text-light">
      <div class="container py-4">
         <div class="border rounded p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
               <h2 class="mb-0">Cervejas</h2>
               <div>
                  <a href="/adm" class="btn btn-outline-light me-2"> ← Voltar </a> <a
                     href="/cervejas/create" class="btn btn-primary"> + Nova
                  Cerveja </a>
               </div>
            </div>
            <div class="table-responsive">
               <table class="table table-dark table-hover align-middle">
                  <thead>
                     <tr>
                        <th>ID</th>
                        <th>Rótulo</th>
                        <th>Preço</th>
                        <th>Volume</th>
                        <th>Teor</th>
                        <th>Cor</th>
                        <th>Temperatura</th>
                        <th>Família / Estilo</th>
                        <th>Descrição</th>
                        <th>Sabor</th>
                        <th>Imagem 1</th>
                        <th>Imagem 2</th>
                        <th>Imagem 3</th>
                        <th>Ações</th>
                     </tr>
                  </thead>
                  <tbody>
                     <tr th:each="cerveja : ${cervejas}">
                        <td th:text="${cerveja.id}"></td>
                        <td><strong th:text="${cerveja.rotulo}"></strong></td>
                        <td th:text="${cerveja.preco}"></td>
                        <td th:text="${cerveja.volume}"></td>
                        <td th:text="${cerveja.teor}"></td>
                        <td th:text="${cerveja.cor}"></td>
                        <td th:text="${cerveja.temperatura}"></td>
                        <td th:text="${cerveja.familia_e_estilo}"></td>
                        <td th:text="${cerveja.descricao}"></td>
                        <td th:text="${cerveja.sabor}"></td>
                        <td><img class="preview-img"
                           th:src="@{'/uploads/images/' + ${cerveja.cervejaria.id} + '/' + ${cerveja.imagem_1}}"
                           alt="Imagem 1"></td>
                        <td><img class="preview-img"
                           th:src="@{'/uploads/images/' + ${cerveja.cervejaria.id} + '/' + ${cerveja.imagem_2}}"
                           alt="Imagem 2"></td>
                        <td><img class="preview-img"
                           th:src="@{'/uploads/images/' + ${cerveja.cervejaria.id} + '/' + ${cerveja.imagem_3}}"
                           alt="Imagem 3"></td>
                        <td style="white-space: nowrap"><a
                           class="btn btn-primary btn-sm"
                           th:href="@{/cervejas/edit(id=${cerveja.id})}"> Edit </a> <a
                           class="btn btn-danger btn-sm"
                           th:href="@{/cervejas/delete(id=${cerveja.id})}"
                           onclick="return confirm('Are You Sure?')"> Delete </a></td>
                     </tr>
                  </tbody>
               </table>
            </div>
         </div>
      </div>
      <script
         src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
         integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
         crossorigin="anonymous"></script>
   </body>
</html>
