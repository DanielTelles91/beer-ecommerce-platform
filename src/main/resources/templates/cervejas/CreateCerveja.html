<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route Express - Nova Cerveja</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
	crossorigin="anonymous">
</head>
<body class="bg-dark text-light">
	<div class="container py-4">
		<div class="row">
			<div class="col-lg-10 mx-auto">
				<div class="border rounded p-4">
					<div class="d-flex justify-content-between align-items-center mb-4">
						<h2 class="mb-0">Nova Cerveja</h2>
						<a href="/cervejas" class="btn btn-outline-light"> ← Voltar </a>
					</div>
					<div th:if="${erro}"
						class="alert alert-danger alert-dismissible fade show"
						role="alert">
						<span th:text="${erro}"></span>
						<button type="button" class="btn-close" data-bs-dismiss="alert">
						</button>
					</div>
					<div th:if="${sucesso}"
						class="alert alert-success alert-dismissible fade show"
						role="alert">
						<span th:text="${sucesso}"></span>
						<button type="button" class="btn-close" data-bs-dismiss="alert">
						</button>
					</div>
					<form method="post" enctype="multipart/form-data"
						th:object="${cervejaDto}">
						<h4 class="mb-4">Dados da Cerveja</h4>
						<div class="mb-4">
							<label class="form-label"> Cervejaria </label> <select
								class="form-select" th:field="*{cervejariaId}" required>
								<option value="">Selecione uma cervejaria</option>
								<option th:each="c : ${cervejarias}" th:value="${c.id}"
									th:text="${c.cervejaria}"></option>
							</select>
						</div>
						<div class="mb-3">
							<label class="form-label"> Rótulo </label> <input
								class="form-control" th:field="*{rotulo}">
							<p class="text-danger" th:if="${#fields.hasErrors('rotulo')}"
								th:errors="*{rotulo}"></p>
						</div>
						<div class="row">
							<div class="col-md-6">
								<div class="mb-3">
									<label class="form-label"> Volume </label> <input
										class="form-control" th:field="*{volume}">
									<p class="text-danger" th:if="${#fields.hasErrors('volume')}"
										th:errors="*{volume}"></p>
								</div>
							</div>
							<div class="col-md-6">
								<div class="mb-3">
									<label class="form-label"> Teor </label> <input
										class="form-control" th:field="*{teor}">
									<p class="text-danger" th:if="${#fields.hasErrors('teor')}"
										th:errors="*{teor}"></p>
								</div>
							</div>
						</div>
						<div class="row">
							<div class="col-md-6">
								<div class="mb-3">
									<label class="form-label"> Cor </label> <input
										class="form-control" th:field="*{cor}">
									<p class="text-danger" th:if="${#fields.hasErrors('cor')}"
										th:errors="*{cor}"></p>
								</div>
							</div>
							<div class="col-md-6">
								<div class="mb-3">
									<label class="form-label"> Temperatura </label> <input
										class="form-control" th:field="*{temperatura}">
									<p class="text-danger"
										th:if="${#fields.hasErrors('temperatura')}"
										th:errors="*{temperatura}"></p>
								</div>
							</div>
						</div>
						<div class="mb-3">
							<label class="form-label"> Família e Estilo </label> <input
								class="form-control" th:field="*{familia_e_estilo}">
							<p class="text-danger"
								th:if="${#fields.hasErrors('familia_e_estilo')}"
								th:errors="*{familia_e_estilo}"></p>
						</div>
						<div class="mb-3">
							<label class="form-label"> Sabor </label> <input
								class="form-control" th:field="*{sabor}">
							<p class="text-danger" th:if="${#fields.hasErrors('sabor')}"
								th:errors="*{sabor}"></p>
						</div>
						<div class="mb-3">
							<label class="form-label"> Descrição </label>
							<textarea class="form-control" rows="4" th:field="*{descricao}">
							</textarea>
							<p class="text-danger" th:if="${#fields.hasErrors('descricao')}"
								th:errors="*{descricao}"></p>
						</div>
						<hr class="my-5">
						<h4 class="mb-4">Imagens do Produto</h4>
						<div class="row">
							<div class="col-md-4">
								<label class="form-label"> Imagem 1 </label> <input
									class="form-control" type="file" th:field="*{imagem_1}">
							</div>
							<div class="col-md-4">
								<label class="form-label"> Imagem 2 </label> <input
									class="form-control" type="file" th:field="*{imagem_2}">
							</div>
							<div class="col-md-4">
								<label class="form-label"> Imagem 3 </label> <input
									class="form-control" type="file" th:field="*{imagem_3}">
							</div>
						</div>
						<div class="row mt-5">
							<div class="col-md-6 d-grid">
								<button type="submit" class="btn btn-success">Salvar
									Cerveja</button>
							</div>
							<div class="col-md-6 d-grid">
								<a class="btn btn-secondary" href="/cervejas"> Cancelar </a>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
</body>
</html>
